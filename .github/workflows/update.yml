name: Update playlists

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build playlists
        run: node scripts/build.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898223+github-actions[bot]@users.noreply.github.com"
          git add -A countries genres top index.json README.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Weekly playlist update $(date -u +%Y-%m-%d)"
          git push
